<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Tools - Registro de usuario</title>
    <link rel="stylesheet" href="css/style_auth.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
</head>
<body>
</head>
<body>
    <header>
        <nav class="cabecera">
            <div class="logo">
                <a href="index.html">
                    <img src="img/artTools_v2.png" alt="Art Tools">
                    <h1>Art Tools</h1>
                </a>
            </div>
            <div class="content-menu">
                <ul class="menu">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="informacion.html">Nosotros</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
                <a class="carrito-nav" href="carrito.html">
                    <img src="img/carrito-de-compras.png" alt="Carrito">
                    <span class="carrito-count oculto">0</span>
                </a>
            </div>
        </nav>
    </header>
    <main>
        <section class="seccion-auth">
            <div class="auth-logo">
                <img src="img/artTools_v2.png" alt="Art Tools">
            </div>
            <form id="form-registro" class="form-card" novalidate>
                <h2>Crear una cuenta</h2>
                <p class="subtitulo">Regístrate para comprar más rápido y guardar tus pedidos.</p>
                <div class="alerta oculto" id="alerta-registro"></div>
                <div class="form-grid">
                    <div class="campo">
                        <label for="run"> RUN (sin puntos ni guion)</label>
                        <input type="text" id="run" name="run" placeholder="Ej: 123456789" maxlength="9">
                        <span class="mensaje-error" id="error-run"></span>
                    </div>
                    <div class="campo">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Nombre" maxlength="50">
                        <span class="mensaje-error" id="error-nombre"></span>
                    </div>
                    <div class="campo">
                        <label for="apellidos">Apellidos</label>
                        <input type="text" id="apellidos" name="apellidos" placeholder="Apellidos" maxlength="50">
                        <span class="mensaje-error" id="error-apellidos"></span>
                    </div>
                    <div class="campo">
                        <label for="correo">Correo</label>
                        <input type="email" id="correo" name="correo" placeholder="john.doe@duocuc.cl" maxlength="100">
                        <span class="mensaje-error" id="error-correo"></span>
                    </div>
                    <div class="campo">
                        <label for="clave">Contraseña</label>
                        <input type="password" id="clave" name="clave" placeholder="Entre 4 y 10 caracteres" maxlength="10">
                        <span class="mensaje-error" id="error-clave"></span>
                    </div>
                    <div class="campo">
                        <label for="clave">Confirmar contraseña</label>
                        <input type="password" id="confirmar-clave" name="confirmar-clave" maxlength="10">
                        <span class="mensaje-error" id="error-confirmarClave"></span>
                    </div>
                    <div class="campo">
                        <label for="telefono">Teléfono<span class="opcional-tag">(opcional)</span></label>
                        <input type="text" id="telefono" name="telefono" placeholder="+56 9 1234 5678">
                        <span class="mensaje-error" id="error-telefono"></span>
                    </div>
                    <div class="campo">
                        <label for="fecha-nacimiento"><span class="opcional-tag">(opcional)</span></label>
                        <input type="date" id="fecha-nacimiento" name="fecha-nacimiento">
                    </div>
                    <div class="campo">
                        <label for="region">Región</label>
                        <select id="region" name="region"></select>
                        <span class="mensaje-error" id="error-region"></span>
                    </div>
                    <div class="campo">
                        <label for="comuna">Comuna</label>
                        <select id="comuna" name="comuna"></select>
                        <span class="mensaje-error" id="error-comuna"></span>
                    </div>
                    <div class="campo campo-full">
                        <label for="direccion">Dirección</label>
                        <input type="text" id="direccion" name="direccion" placeholder="Calle, número, depto." maxlength="300">
                        <span class="mensaje-error" id="error-direccion"></span>
                    </div>
                </div>
                <div class="form-acciones">
                    <button type="submit">Registrar</button>
                </div>
                <p class="form-enlace-secundario">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </form>
        </section>
    </main>
    <footer>
        <div class="footer-cont">
            <a class="footer-logo" href="index.html">
                <img src="img/artTools_v2.png" alt="logo art tools">
                <h2>Art Tools</h2>
            </a>
            <ul>
                <li><a href="informacion.html">Nosotros</a></li>
                <li><a href="contacto.html"></a>Contáctanos</li>
                <li><a href="blogs.html"></a>Blog</li>
            </ul>
        </div>
        <p>&copy; 2026 Art Tools</p> 
    </footer>
    <script src="#"></script>
</body>
</html>
