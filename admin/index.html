<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Tools - Panel administrador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <aside class="admin-sidebar">
        <div class="admin-logo">
            <img src="../img/artTools_v2.png" alt="Art Tools">
            <h1>Art Tools</h1>
            <span>Panel adimistrador</span>
        </div>
        <ul class="admin-menu">
            <li><a href="index.html" class="activo">Dashboard</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li data-solo-admin><a href="usuarios.html">Usuarios</a></li>
        </ul>
        <div class="admin-pie">
            <span id="admin-nombre-usuario"></span>
            <a href="../index.html">Volver a la tienda</a>
            <button type="button" id="btn-cerrar-sesion-adimin">Cerrar Sesión</button>
        </div>
    </aside>
    <main class="admin-main">
        <div class="admin-topbar">
            <h2 id="saludo-admin">¡Hola!</h2>
            <span class="rol-badge" id="rol-badge"></span>
        </div>
        <div class="admin-cards">
            <div class="valor" id="card-total-productos">0</div>
            <div class="etiqueta">Productos en catálogo</div>
        </div>
        <div class="admin-card alerta">
            <div class="valor" id="card-stock-critico">0</div>
            <div class="etiqueta">Productos con stock crítico</div>
        </div>
        <div class="admin-card" id="card-usuarios-cont">
            <div class="valor" id="card-total-usuarios">0</div>
            <div class="etiqueta">Usuarios registrados</div>
        </div>
        <div class="admin-panel">
            <h2>Alertas de stock crítico</h2>
            <ul id="lista-stock-critico"></ul>
        </div>
    </main>
    <script src="#"></script>
</body>
</html>
