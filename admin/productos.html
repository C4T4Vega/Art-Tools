<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Tools - Administrar productos</title>
    <link rel="stylesheet" href="../css/base.css"/>
    <link rel="stylesheet" href="../css/admin.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <aside class="admin-sidebar">
        <div class="admin-logo">
           <div class="logo">
                <img src="../img/artTools_v2.png" alt="Art Tools"/>
                <h1>Art Tools</h1>
            </div>
            <span>Panel admin</span>
        </div>
        <ul class="admin-menu">
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="productos.html" class="activo">Productos</a></li>
            <li data-solo-admin><a href="usuarios.html">Usuarios</a></li>
        </ul>
        <div class="admin-pie">
            <span id="admin-nombre-usuario"></span>
            <a href="../index.html">Volver a la tienda</a>
            <button type="button" id="btn-cerrar-sesion-admin">Cerrar sesión</button>
        </div>
    </aside>
    <main class="admin-main">
        <div class="admin-topbar">
            <h1>Productos</h1>
            <span class="rol-badge" id="rol-badge"></span>
        </div>
        <div class="admin-panel" id="panel-productos">
            <div class="admin-acciones-top">
                <input type="text" class="admin-buscador" id="buscador-productos" placeholder="Buscar por nombre o código...">
                <a class="btn-primario" href="producto-form.html" id="btn-nuevo-producto">+ Nuevo producto</a>
            </div>
            <div style="overflow-x:auto;">
                <table class="admin-tabla">
                    <thead>
                        <tr>
                            <th>Imagen</th>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-productos"></tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="../js/utils.js"></script>
    <script src="../js/regiones.js"></script>
    <script src="../js/productos-data.js"></script>
    <script src="../js/usuarios-data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin-productos.js"></script>
</body>
</html>
