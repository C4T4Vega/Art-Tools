<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Tools - Nuevo/Editar producto</title>
    <link rel="stylesheet" href="../css/base.css"/>
    <link rel="stylesheet" href="../css/admin.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <aside class="admin-sidebar">
        <div class="admin-logo">
           <div class="logo">
                <img src="../img/artTools_v2.png" alt="Art Tools"/>
                <h1>Art Tools</h1>
            </div>
            <span>Panel admin</span>
        </div>
        <ul class="admin-menu">
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="productos.html" class="activo">Productos</a></li>
            <li data-solo-admin><a href="usuarios.html">Usuarios</a></li>
        </ul>
        <div class="admin-pie">
            <span id="admin-nombre-usuario"></span>
            <a href="../index.html">Volver a la tienda</a>
            <button type="button" id="btn-cerrar-sesion-admin">Cerrar sesión</button>
        </div>
    </aside>
    <main class="admin-main">
        <div class="admin-topbar">
            <h2 id="titulo-form-producto">Nuevo producto</h2>
            <span class="rol-badge" id="rol-badge"></span>
        </div>
        <div class="admin-form-panel" id="admin-form-panel">
            <form id="form-producto" novalidate>
                <div class="alerta oculto" id="alerta-producto"></div>
                <div class="form-grid">
                    <div class="campo">
                        <label for="codigo">Código de producto</label>
                        <input type="text" id="codigo" name="codigo" placeholder="Ej: TEC-004">
                        <span class="mensaje-error" id="error-codigo"></span>
                    </div>
                    <div class="campo">
                        <label for="categoria">Categoría</label>
                        <select id="categoria" name="categoria">
                            <option value="">-- Seleccione categoría --</option>
                        </select>
                        <span class="mensaje-error" id="error-categoria"></span>
                    </div>
                    <div class="campo campo-full">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" maxlength="100" placeholder="Nombre del producto">
                        <span class="mensaje-error" id="error-nombre"></span>
                    </div>
                    <div class="campo campo-full">
                        <label for="descripcion">Descripción <span class="opcional-tag">(opcional)</span></label>
                        <textarea id="descripcion" name="descripcion" maxlength="500" placeholder="Describe el producto"></textarea>
                        <span class="mensaje-error" id="error-descripcion"></span>
                    </div>
                    <div class="campo">
                        <label for="precio">Precio (CLP)</label>
                        <input type="number" id="precio" name="precio" min="0" step="1">
                        <span class="mensaje-error" id="error-precio"></span>
                    </div>
                    <div class="campo">
                        <label for="stock">Stock</label>
                        <input type="number" id="stock" name="stock" min="0" step="1">
                        <span class="mensaje-error" id="error-stock"></span>
                    </div>
                    <div class="campo">
                        <label for="stock-critico">Stock crítico <span class="opcional-tag">(opcional)</span></label>
                        <input type="number" id="stock-critico" name="stock-critico" min="0" step="1">
                        <span class="mensaje-error" id="error-stockCritico"></span>
                        <span class="mensaje-ayuda">Se mostrará una alerta cuando el stock llegue a este número o menos.</span>
                    </div>
                    <div class="campo campo-full">
                        <label for="imagen">Ruta o URL de la imagen <span class="opcional-tag">(opcional)</span></label>
                        <input type="text" id="imagen" name="imagen" placeholder="img/productos/mi-producto.jpg">
                        <img id="imagen-preview" class="imagen-preview" src="../img/productos/placeholder.svg" alt="Vista previa"/>
                    </div>
                </div>
                <div class="form-acciones" style="max-width:250px; margin-top:25px;">
                    <button type="submit">Guardar producto</button>
                </div>
            </form>
        </div>
    </main>
    <script src="../js/utils.js"></script>
    <script src="../js/regiones.js"></script>
    <script src="../js/productos-data.js"></script>
    <script src="../js/usuarios-data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin-productos.js"></script>
</body>
</html>
